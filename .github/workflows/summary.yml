name: Summarize new issues

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Build a safe issue summary from the event payload
        id: summary
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          const event = JSON.parse(readFileSync(process.env.EVENT_PATH, "utf8"));
          const title = String(event.issue?.title ?? "Untitled issue").replace(/[\r\n\t]+/g, " ").replace(/\s+/g, " ").trim().slice(0, 200);
          const body = String(event.issue?.body ?? "").replace(/[\r\n\t]+/g, " ").replace(/\s+/g, " ").trim().slice(0, 700);
          const summary = "Issue summary: " + title + (body ? " — " + body : "");
          appendFileSync(process.env.GITHUB_OUTPUT, "summary<<END_SUMMARY\n" + summary + "\nEND_SUMMARY\n");
          NODE
      - name: Comment with the generated summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SUMMARY: ${{ steps.summary.outputs.summary }}
        run: gh issue comment "$ISSUE_NUMBER" --body "$SUMMARY"
