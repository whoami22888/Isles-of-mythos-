name: Performance Acceptance

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sustained-load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/isles_test
      JWT_SECRET: performance-test-secret-012345678901234567890123
      CORS_ORIGIN: http://127.0.0.1:5173
      SERVER_HOST: 127.0.0.1
      SERVER_PORT: 3000
      LOADTEST_BASE_URL: http://127.0.0.1:3000
      LOADTEST_DURATION_MS: 10000
      LOADTEST_HTTP_REQUESTS: 100
    services:
      postgres:
        image: cgr.dev/chainguard/postgres@sha256:1a417cf464d938b1b1182411416401215af7fbc88395d9b90f7c805e96d639a7
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: isles_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d isles_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify pinned PostgreSQL image and signed attestations
        env:
          POSTGRES_IMAGE: cgr.dev/chainguard/postgres@sha256:1a417cf464d938b1b1182411416401215af7fbc88395d9b90f7c805e96d639a7
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$POSTGRES_IMAGE" | tee postgres-image-inspect.txt
          grep -F "Digest: sha256:1a417cf464d938b1b1182411416401215af7fbc88395d9b90f7c805e96d639a7" postgres-image-inspect.txt
          docker pull "$POSTGRES_IMAGE"
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install github.com/sigstore/cosign/v2/cmd/cosign@v2.4.1
          COSIGN_IDENTITY="https://github.com/chainguard-images/images/.github/workflows/release.yaml@refs/heads/main"
          COSIGN_ISSUER="https://token.actions.githubusercontent.com"
          POSTGRES_AMD64_IMAGE="cgr.dev/chainguard/postgres@sha256:17e9772ea0445f2dba3faee359b571c899b89b0fb09098fc38d390dc73f141c0"
          POSTGRES_ARM64_IMAGE="cgr.dev/chainguard/postgres@sha256:a18c38fdfbb5f99f636ad01e34ef0a4468832ddc4ea7e3e329720244462d0930"
          "$RUNNER_TEMP/bin/cosign" verify --certificate-identity="$COSIGN_IDENTITY" --certificate-oidc-issuer="$COSIGN_ISSUER" "$POSTGRES_AMD64_IMAGE" | tee postgres-signature-amd64.json
          "$RUNNER_TEMP/bin/cosign" verify-attestation --type https://slsa.dev/provenance/v1 --certificate-identity="$COSIGN_IDENTITY" --certificate-oidc-issuer="$COSIGN_ISSUER" "$POSTGRES_AMD64_IMAGE" | tee postgres-provenance-amd64.json
          "$RUNNER_TEMP/bin/cosign" verify-attestation --type https://spdx.dev/Document --certificate-identity="$COSIGN_IDENTITY" --certificate-oidc-issuer="$COSIGN_ISSUER" "$POSTGRES_AMD64_IMAGE" | tee postgres-sbom-amd64.json
          "$RUNNER_TEMP/bin/cosign" verify --certificate-identity="$COSIGN_IDENTITY" --certificate-oidc-issuer="$COSIGN_ISSUER" "$POSTGRES_ARM64_IMAGE" | tee postgres-signature-arm64.json
          "$RUNNER_TEMP/bin/cosign" verify-attestation --type https://slsa.dev/provenance/v1 --certificate-identity="$COSIGN_IDENTITY" --certificate-oidc-issuer="$COSIGN_ISSUER" "$POSTGRES_ARM64_IMAGE" | tee postgres-provenance-arm64.json
          "$RUNNER_TEMP/bin/cosign" verify-attestation --type https://spdx.dev/Document --certificate-identity="$COSIGN_IDENTITY" --certificate-oidc-issuer="$COSIGN_ISSUER" "$POSTGRES_ARM64_IMAGE" | tee postgres-sbom-arm64.json
      - name: Scan pinned PostgreSQL image and emit CycloneDX SBOM
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: cgr.dev/chainguard/postgres@sha256:1a417cf464d938b1b1182411416401215af7fbc88395d9b90f7c805e96d639a7
          format: cyclonedx
          output: postgres.sbom.cdx.json
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rebuild reviewed native dependencies
        run: npm rebuild argon2 esbuild
      - name: Migrate database
        run: npm run migrate:up
      - name: Seed 5,000 player identities
        run: PGPASSWORD=postgres psql "$DATABASE_URL" -c "INSERT INTO users (username, email, password_hash) SELECT 'loadtest_' || g, 'loadtest_' || g || '@example.invalid', 'loadtest-password-hash' FROM generate_series(0, 4999) AS g ON CONFLICT DO NOTHING;"
      - name: Build
        run: npm run build
      - name: Start server
        run: |
          node server/dist/index.js > performance-server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ready >/dev/null; then exit 0; fi
            sleep 1
          done
          cat performance-server.log
          exit 1
      - name: Capture host and PostgreSQL metrics during load
        run: |
          (
            while kill -0 "$(cat server.pid)" 2>/dev/null; do
              printf '%s\n' "--- $(date -Is) ---"
              ps -p "$(cat server.pid)" -o pid=,pcpu=,pmem=,rss=,etime=
              PGPASSWORD=postgres psql "$DATABASE_URL" -Atc "SELECT now(), numbackends, xact_commit, xact_rollback, blks_read, blks_hit FROM pg_stat_database WHERE datname='isles_test';"
              sleep 1
            done
          ) > performance-system.log 2>&1 &
      - name: Self-test persisted-evidence validator
        run: node scripts/validate-performance-report.mjs --self-test
      - name: Run sustained player-load and domain stress scenarios
        run: node scripts/sustained-load.mjs
      - name: Validate persisted gameplay and stress evidence
        run: node scripts/validate-performance-report.mjs performance-results.json
      - name: Stop server
        if: always()
        run: |
          kill "$(cat server.pid)" 2>/dev/null || true
          wait "$(cat server.pid)" 2>/dev/null || true
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: performance-acceptance-evidence
          path: |
            performance-results.json
            performance-system.log
            performance-server.log
            postgres-image-inspect.txt
            postgres-signature-amd64.json
            postgres-provenance-amd64.json
            postgres-sbom-amd64.json
            postgres-signature-arm64.json
            postgres-provenance-arm64.json
            postgres-sbom-arm64.json
            postgres.sbom.cdx.json
          if-no-files-found: error
