name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      ENVIRONMENT: test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/isles_test
      JWT_SECRET: test-only-jwt-secret-not-for-production
    services:
      postgres:
        image: cgr.dev/chainguard/postgres@sha256:1a417cf464d938b1b1182411416401215af7fbc88395d9b90f7c805e96d639a7
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: isles_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d isles_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rebuild reviewed native dependencies
        run: npm rebuild argon2 esbuild
      - name: Verify no unreviewed install scripts
        run: |
          pending="$(npm install-scripts ls)"
          echo "$pending"
          echo "$pending" | grep -F "No packages with unreviewed install scripts."
      - name: Run lint and typecheck in parallel
        shell: bash
        run: |
          set +e
          npm run lint > "$RUNNER_TEMP/lint.log" 2>&1 &
          lint_pid=$!
          npm run typecheck > "$RUNNER_TEMP/typecheck.log" 2>&1 &
          typecheck_pid=$!

          wait "$lint_pid"
          lint_status=$?
          wait "$typecheck_pid"
          typecheck_status=$?

          cat "$RUNNER_TEMP/lint.log"
          cat "$RUNNER_TEMP/typecheck.log"

          if [ "$lint_status" -ne 0 ] || [ "$typecheck_status" -ne 0 ]; then
            exit 1
          fi
      - run: npm audit --audit-level=high
      - run: npm run migrate:up
      - name: Verify PostgreSQL backup and restore
        run: |
          mkdir -p "$RUNNER_TEMP/isles-backup"
          docker run --rm --network host -e PGPASSWORD=postgres -v "$RUNNER_TEMP/isles-backup:/backup" --entrypoint pg_dump cgr.dev/chainguard/postgres@sha256:1a417cf464d938b1b1182411416401215af7fbc88395d9b90f7c805e96d639a7 -Fc -h 127.0.0.1 -U postgres -d isles_test -f /backup/isles_test.dump
          docker run --rm --network host -e PGPASSWORD=postgres --entrypoint psql cgr.dev/chainguard/postgres@sha256:1a417cf464d938b1b1182411416401215af7fbc88395d9b90f7c805e96d639a7 -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE isles_restore"
          docker run --rm --network host -e PGPASSWORD=postgres -v "$RUNNER_TEMP/isles-backup:/backup" --entrypoint pg_restore cgr.dev/chainguard/postgres@sha256:1a417cf464d938b1b1182411416401215af7fbc88395d9b90f7c805e96d639a7 --no-owner -h 127.0.0.1 -U postgres -d isles_restore /backup/isles_test.dump
          docker run --rm --network host -e PGPASSWORD=postgres --entrypoint psql cgr.dev/chainguard/postgres@sha256:1a417cf464d938b1b1182411416401215af7fbc88395d9b90f7c805e96d639a7 -h 127.0.0.1 -U postgres -d isles_restore -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) > 0 FROM information_schema.tables WHERE table_schema = 'public'"

      - name: Validate Docker Compose configuration
        env:
          POSTGRES_PASSWORD: postgres
          DATABASE_URL: postgres://postgres:postgres@postgres:5432/isles
          JWT_SECRET: test-only-jwt-secret-not-for-production
          CORS_ORIGIN: http://localhost:5173
          PUBLIC_DOMAIN: localhost
          ACME_EMAIL: ci@example.invalid
        run: docker compose config -q

      - name: Run cross-instance combat cooldown regression
        run: npm run test -w server -- src/index.test.ts -t "enforces one authoritative projectile cooldown across server instances"

      - run: npm run test
      - run: npm run build

      - name: Build production Docker image
        run: docker build --pull --tag isles-of-mythos:ci .

      - name: Smoke test production frontend
        shell: bash
        run: |
          set -euo pipefail
          container="isles-production-smoke"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker run --detach --network host --name "$container" \
            -e ENVIRONMENT=test \
            -e DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/isles_test \
            -e JWT_SECRET=test-only-jwt-secret-not-for-production \
            -e CORS_ORIGIN=http://127.0.0.1:3000 \
            -e SERVER_HOST=127.0.0.1 \
            -e SERVER_PORT=3000 \
            isles-of-mythos:ci
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then
              docker logs "$container"
              exit 1
            fi
            sleep 1
          done
          index="$(curl --fail --silent http://127.0.0.1:3000/)"
          printf '%s' "$index" | grep -F '<script type="module"'
          asset="$(printf '%s' "$index" | sed -n 's/.*src="\([^"]*\.js\)".*/\1/p' | head -n 1)"
          test -n "$asset"
          curl --fail --silent "http://127.0.0.1:3000$asset" >/dev/null
